<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-heart-pulse-fill text-primary" style="font-size: 3rem;"></i>
          <h4 class="mt-2">Clínica</h4>
          <p class="text-muted mb-0">Inicia sesión para continuar</p>
        </div>

        <div id="error" class="alert alert-danger d-none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100" id="btnLogin">Entrar</button>
        </form>

        <div class="text-center mt-3">
          <a href="index.html" class="small">← Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
